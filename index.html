<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>My Money Bloom</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Quicksand:wght@500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF9F6;--bg2:#FFF0F3;--p:#F4B8C8;--r:#D9799A;--d:#9D4569;--t:#49343E;--t2:#987F8B;--b:#F0DDE4;--c:#fff;--g:#5E8B6A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241A1F;--bg2:#31232A;--t:#F6E8EE;--t2:#BFA3B0;--b:#46323C;--c:#2D2127;--g:#8DBB98;--p:#7A4259}}
:root[data-theme="dark"]{--bg:#241A1F;--bg2:#31232A;--t:#F6E8EE;--t2:#BFA3B0;--b:#46323C;--c:#2D2127;--g:#8DBB98;--p:#7A4259}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 Inter,system-ui,sans-serif;display:flex;justify-content:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{width:100%;max-width:560px;padding:20px 16px 110px}
h1,h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;margin:0}
h1{font-size:30px;color:var(--d)}h2{font-size:20px;margin:22px 0 10px}
.sub{color:var(--t2);font-size:13px}
.card{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(217,121,154,.08)}
.hero{background:linear-gradient(160deg,var(--bg2),var(--c));}
.big{font-family:'DM Serif Display',Georgia,serif;font-size:32px;color:var(--d);line-height:1.1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mon{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0}
.mon button,.ghost{background:var(--c);border:1px solid var(--b);color:var(--d);border-radius:12px;padding:6px 12px;font:inherit;cursor:pointer}
.stat{flex:1;background:var(--bg2);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:15px}.inc{color:var(--g)}.exp{color:var(--d)}
.bar{height:8px;background:var(--bg2);border-radius:8px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--r));border-radius:8px}
.tx{padding:11px 0;border-bottom:1px solid var(--b)}.tx:last-child{border:0}
.tx button{background:none;border:0;color:var(--t2);cursor:pointer;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--c);border-top:1px solid var(--b);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{display:flex;width:100%;max-width:560px;justify-content:space-around}
nav button{background:none;border:0;color:var(--t2);font:500 12px Inter,sans-serif;padding:6px 14px;cursor:pointer}nav button.on{color:var(--d)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--r);color:#fff;border:0;border-radius:28px;padding:14px 20px;font:600 15px Inter,sans-serif;box-shadow:0 6px 18px rgba(157,69,105,.35);cursor:pointer;z-index:6}
.sheet{position:fixed;inset:0;background:rgba(73,52,62,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.show{display:flex}.sheet>div{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
label{display:block;font-size:12px;color:var(--t2);margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:12px;padding:11px;font:inherit}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t2);font:inherit;cursor:pointer}.seg button.on{background:var(--p);color:var(--d);border-color:var(--p)}
.save{width:100%;margin-top:16px;background:var(--d);color:#fff;border:0;border-radius:14px;padding:14px;font:600 15px Inter,sans-serif;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--d);color:#fff;padding:10px 16px;border-radius:14px;display:none;z-index:30}
#toast button{background:none;border:0;color:#fff;text-decoration:underline;font:inherit;margin-left:10px;cursor:pointer}
.empty{text-align:center;color:var(--t2);padding:24px 8px}
:root{--ink:#8a4a63;--mint:#DDF0DF;--mintd:#4E8A5E;--rosy:#FADADD;--sun:#FFF1C9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E8B4C8;--mint:#2C3F33;--rosy:#4A2A36;--sun:#4A4128}}
:root[data-theme="dark"]{--ink:#E8B4C8;--mint:#2C3F33;--rosy:#4A2A36;--sun:#4A4128}
body{font-family:Quicksand,system-ui,sans-serif;font-weight:500;background-image:radial-gradient(var(--b) 1.4px,transparent 1.5px);background-size:22px 22px}
h1,h2,.big,.mon b{font-family:Gaegu,'Comic Sans MS',cursive;font-weight:700}
h1{font-size:42px;display:inline-block;transform:rotate(-1.5deg)}
h2{text-align:center;font-size:27px}h2::after{content:"━━ ♥ ━━";display:block;font-size:11px;color:var(--r);letter-spacing:2px}
.spk{color:var(--r);font-size:24px;display:inline-block;animation:tw 2.2s infinite}@keyframes tw{50%{opacity:.35;transform:scale(.7) rotate(25deg)}}
.card{border:2px solid var(--ink);border-radius:26px 20px 28px 18px/20px 28px 18px 26px;box-shadow:3px 4px 0 var(--p);animation:pop .45s both}@keyframes pop{from{opacity:0;transform:scale(.95) translateY(10px)}}
.hero{background:var(--bg2)}.big{font-size:48px;color:var(--mintd)}
.stat{border:2px solid var(--ink);border-radius:18px 14px 20px 14px/14px 20px 14px 18px;text-align:center;padding:8px 4px}.stat:nth-child(1){background:var(--mint)}.stat:nth-child(2){background:var(--rosy)}.stat:nth-child(3){background:var(--sun)}
.stat b{font-size:14px}.stat span{font-weight:700}
.bars{margin:14px 0 4px}.bar{height:13px;border:1.5px solid var(--ink);background:var(--c)}.bar.pk i{background:var(--p)}.bar.mt i{background:#A9D8B3}
.ic{width:40px;height:40px;border-radius:50%;background:var(--bg2);border:1.5px dashed var(--ink);display:grid;place-items:center;font-size:20px;flex:none}
.tx{border-bottom:1.5px dashed var(--b)}
.mon b{font-size:26px}.mon button{border:2px solid var(--ink);border-radius:50%;width:36px;height:36px;padding:0}
.fab{border:2px solid var(--ink);background:var(--p);color:var(--d);font-family:Gaegu,cursive;font-size:22px;font-weight:700;padding:8px 22px;box-shadow:3px 4px 0 var(--ink);animation:bob 2.6s ease-in-out infinite}.hrt{color:var(--r);font-size:24px}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
nav{border-top:2px dashed var(--ink)}nav button{font-family:Quicksand,sans-serif;font-weight:700}
.save{border:2px solid var(--ink);background:var(--r);box-shadow:3px 4px 0 var(--ink);font-family:Gaegu,cursive;font-size:22px}
.sheet>div{border:2px solid var(--ink);border-bottom:0}.seg button{border:2px solid var(--b)}.seg button.on{border-color:var(--ink)}
input,select,textarea{border:2px solid var(--b);border-radius:14px;font-family:Quicksand,sans-serif}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.mintc{background:var(--mint)}.rosyc{background:var(--rosy)}.sunc{background:var(--sun)}
.dc{display:flex;gap:10px;margin-bottom:12px}.dc .card{flex:1;margin:0}.big2{font-family:Gaegu,cursive;font-size:32px;font-weight:700;color:var(--d)}
.pl{width:62px;border:2px solid var(--ink);border-radius:20px 16px 22px 16px/16px 22px 16px 20px;font:700 38px Gaegu,cursive;color:#6b2f4a;cursor:pointer;box-shadow:2px 3px 0 var(--ink)}.mintcb{background:#A9D8B3}.rosycb{background:var(--p)}.suncb{background:#FFD66E}
.pie{width:130px;height:130px;border-radius:50%;border:2px solid var(--ink);flex:none}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid var(--ink)}
.gi{width:90px;padding:6px 8px}.cr{margin-bottom:12px}.bar.over i{background:var(--r)}
</style></head><body><div id="app"></div>
<nav><div><button data-v="home">♡ Home</button><button data-v="bud">✎ Budget</button><button data-v="sav">🐷 Savings</button><button data-v="set">✿ Settings</button></div></nav>
<button class="fab" onclick="openAdd()"><span class="hrt">♥</span> + Add transaction</button>
<div class="sheet" id="sh"><div id="shc"></div></div><div id="toast"></div>
<script>
const IC={'Housing':'🏠','Food & groceries':'🛒','Eating out':'🍔','Transport':'🚌','Shopping':'🛍️','Beauty & self-care':'💄','Education':'📚','Subscriptions':'📺','Travel':'✈️','Health':'💊','Fitness':'🏋️','Family':'👨‍👩‍👧','Fun':'🎀','Other':'✨','Salary':'💼','Freelance':'🎨','Business':'🌷','Savings':'🐷','Other income':'💸','Transfer':'🔁'};
const K='mmb1',EXP=['Housing','Food & groceries','Eating out','Transport','Shopping','Beauty & self-care','Education','Subscriptions','Travel','Health','Fitness','Family','Fun','Other'],INC=['Salary','Freelance','Business','Other income'];
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{accts:[{id:'a1',name:'Alipay',cur:'CNY',open:0},{id:'a2',name:'WeChat',cur:'CNY',open:0},{id:'a3',name:'Savings USD',cur:'USD',open:0},{id:'a4',name:'Cash ARS',cur:'ARS',open:0}],tx:[],intent:'I manage my money with clarity. I spend intentionally and build a life with freedom and abundance.'};
S.goals=S.goals||[];S.budgets=S.budgets||{};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,c)=>{try{return new Intl.NumberFormat('en',{style:'currency',currency:c,maximumFractionDigits:2}).format(n)}catch(e){return c+' '+n.toFixed(2)}};
const today=()=>new Date().toLocaleDateString('sv');
let V='home',M=today().slice(0,7),Q='';
const acc=id=>S.accts.find(a=>a.id==id)||{name:'?',cur:''};
const bal=a=>S.tx.reduce((s,t)=>t.acct==a.id?s+(t.type=='income'?t.amt:-t.amt):t.to==a.id&&t.type=='transfer'?s+t.amt:s,+a.open||0);
const curs=()=>[...new Set(S.accts.map(a=>a.cur))];
const mlabel=()=>new Date(M+'-01T12:00:00').toLocaleDateString('en',{month:'long',year:'numeric'});
function shift(d){const x=new Date(M+'-01T12:00:00');x.setMonth(x.getMonth()+d);M=x.toLocaleDateString('sv').slice(0,7);render()}
function txRow(t,del){const a=acc(t.acct),tr=t.type=='transfer';
return`<div class="tx row"><div class="ic">${IC[t.cat]||'🌸'}</div><div style="flex:1"><b>${esc(t.desc||t.cat)}</b><div class="sub">${esc(tr?a.name+' → '+acc(t.to).name:t.type=='saving'?'Savings → '+((S.goals.find(g=>g.id==t.goal)||{}).name||'dream')+' · '+a.name:t.cat+' · '+a.name)} · ${t.date}</div></div><div class="row"><b class="${t.type=='income'?'inc':tr?'':'exp'}">${t.type=='income'?'+':tr?'':'−'}${fmt(t.amt,a.cur)}</b>${del?`<button onclick="del('${t.id}')" aria-label="Delete">✕</button>`:''}</div></div>`}
const PAL=['#F4B8C8','#FFD9A8','#C9E4C5','#BFD8F2','#E3C9F2','#FFF1A8','#F9C6B8','#B8E0D8'];
const mpick=()=>`<div class="mon"><button onclick="shift(-1)" aria-label="Previous month">‹</button><b>${mlabel()}</b><button onclick="shift(1)" aria-label="Next month">›</button></div>`;
const mcurs=mt=>{const cs=curs().filter(c=>mt.some(t=>acc(t.acct).cur==c));return cs.length?cs:[S.accts[0].cur]};
function home(){const mt=S.tx.filter(t=>t.date.startsWith(M));
let h=`<div class="sub">✿ welcome back</div><h1>My Money Bloom <span class="spk">✦</span></h1>${mpick()}<h2>Monthly detail</h2>`;
mcurs(mt).forEach(c=>{const f=ty=>mt.filter(t=>t.type==ty&&acc(t.acct).cur==c).reduce((s,t)=>s+t.amt,0);
h+=`<div class="sub" style="margin:6px 4px">${c}</div>`+[['income','Income','🌿','mintc'],['expense','Expenses','🌷','rosyc'],['saving','Savings','🐷','sunc']].map(([ty,n,e,k])=>`<div class="dc"><div class="card ${k}"><div class="sub">${e} ${n}</div><div class="big2">${fmt(f(ty),c)}</div></div><button class="pl ${k}b" onclick="openAdd('${ty}')" aria-label="Add ${n}">+</button></div>`).join('')+`<div class="sub" style="text-align:center;margin-bottom:10px">left to enjoy this month ✿ <b>${fmt(f('income')-f('expense')-f('saving'),c)}</b></div>`});
h+=`<h2>Recent</h2><div class="card">`+(mt.length?[...mt].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,5).map(t=>txRow(t)).join(''):`<div class="empty">Your first transaction will bloom here.</div>`)+`</div>`;
return h+`<div class="card sunc"><div class="sub">My intention</div><div style="font-family:Gaegu,cursive;font-size:22px;color:var(--d);margin-top:4px">${esc(S.intent)}</div></div>`}
function bud(){const mt=S.tx.filter(t=>t.date.startsWith(M));let h=`<h1>Budget</h1>${mpick()}`;
mcurs(mt).forEach(c=>{const ex=mt.filter(t=>t.type=='expense'&&acc(t.acct).cur==c),by={};ex.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
const tot=ex.reduce((s,t)=>s+t.amt,0),goal=EXP.reduce((s,k)=>s+(+S.budgets[c+'|'+k]||0),0),used=EXP.filter(k=>by[k]);
h+=`<h2>${c} · where it went</h2><div class="card">`;
if(tot){let a=0;const st=used.map((k,i)=>{const s=a;a+=by[k]/tot*100;return`${PAL[i%8]} ${s}% ${a}%`}).join(',');
h+=`<div class="row" style="gap:16px"><div class="pie" style="background:conic-gradient(${st})"></div><div style="flex:1">${used.map((k,i)=>`<div class="sub"><i class="dot" style="background:${PAL[i%8]}"></i>${IC[k]} ${esc(k)} ${Math.round(by[k]/tot*100)}%</div>`).join('')}</div></div>`}else h+=`<div class="empty">No expenses yet this month ✿</div>`;
h+=`</div>`;
if(goal)h+=`<div class="card sunc"><div class="row"><b>Monthly budget</b><span>${fmt(goal,c)}</span></div><div class="bar${tot>goal?' over':''}"><i style="width:${Math.min(100,Math.round(tot/goal*100))}%"></i></div><div class="row sub" style="margin-top:6px"><span>Spent ${fmt(tot,c)}</span><span>Available ${fmt(Math.max(goal-tot,0),c)}</span></div></div>`;
h+=`<div class="card">`+EXP.map(k=>{const g=+S.budgets[c+'|'+k]||0,s=by[k]||0;return`<div class="cr"><div class="row"><span>${IC[k]} ${esc(k)}</span><span class="sub">${fmt(s,c)}</span><input class="gi" type="number" step="any" placeholder="goal" value="${g||''}" onchange="S.budgets['${c}|${k}']=+this.value||0;save();render()" aria-label="Goal for ${esc(k)}"></div>${g?`<div class="bar${s>g?' over':''}"><i style="width:${Math.min(100,Math.round(s/g*100))}%"></i></div>${s>g?'<div class="sub">a little over this month ✿</div>':''}`:''}</div>`}).join('')+`</div>`});
return h+`<h2>Every transaction</h2><div class="card">`+(mt.length?[...mt].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).map(t=>txRow(t,1)).join(''):`<div class="empty">Nothing here yet ✿</div>`)+`</div>`}
function sav(){let h=`<h1>Savings</h1><div class="sub">What am I saving for? ✿</div>`;
h+=S.goals.length?S.goals.map(g=>{const sv=S.tx.filter(t=>t.type=='saving'&&t.goal==g.id&&acc(t.acct).cur==g.cur).reduce((s,t)=>s+t.amt,0),p=Math.min(100,Math.round(sv/g.target*100));
return`<div class="card sunc" style="margin-top:12px"><div class="row"><div><b style="font-size:18px">${g.emoji} ${esc(g.name)}</b><div class="sub">${esc(g.why)}</div></div><span style="font-size:28px">${p>=100?'🌺':p>=66?'🌸':p>=33?'🌷':'🌱'}</span></div><div class="bar" style="margin-top:10px"><i style="width:${p}%"></i></div><div class="row sub" style="margin-top:6px"><span>${fmt(sv,g.cur)} of ${fmt(g.target,g.cur)} · ${p}%</span><span>${fmt(Math.max(g.target-sv,0),g.cur)} to go</span></div><button class="ghost" style="margin-top:10px" onclick="openAdd('saving','${g.id}')">+ Add to this dream</button></div>`}).join(''):`<div class="card empty" style="margin-top:12px">Plant your first dream below 🌱</div>`;
return h+`<h2>New dream</h2><div class="card"><label>Name</label><input id="gn" placeholder="Trip to Argentina"><label>Why does it matter?</label><input id="gw" placeholder="To hug my family"><div class="row"><div style="flex:1"><label>Target</label><input id="gt" type="number" step="any"></div><div style="width:100px"><label>Currency</label><select id="gc">${['CNY','USD','ARS','EUR'].map(c=>`<option>${c}</option>`).join('')}</select></div></div><label>Sticker</label><select id="ge">${['🏝️','✈️','🏠','🎓','🛟','🌸','💍','🚗'].map(e=>`<option>${e}</option>`).join('')}</select><button class="save" onclick="addGoal()">Plant this dream</button></div>`}
function addGoal(){const n=$('#gn').value.trim(),g=+$('#gt').value;if(!n||!(g>0))return;S.goals.push({id:'g'+Date.now(),name:n,why:$('#gw').value.trim(),target:g,cur:$('#gc').value,emoji:$('#ge').value});save();render();toast('Dream planted 🌱')}
function setv(){return`<h1>Settings</h1><h2>Accounts &amp; opening balances</h2>`+S.accts.map(a=>`<div class="card"><div class="row"><b>${esc(a.name)} <span class="sub">${a.cur}</span></b><input type="number" step="any" value="${a.open}" style="width:140px" onchange="S.accts.find(x=>x.id=='${a.id}').open=+this.value||0;save()" aria-label="Opening balance"></div></div>`).join('')+`<div class="card"><label>Add account</label><div class="row"><input id="an" placeholder="Name"><select id="ac" style="width:100px">${['CNY','USD','ARS','EUR'].map(c=>`<option>${c}</option>`).join('')}</select></div><button class="save" onclick="addAcc()">Add account</button></div><h2>My intention</h2><div class="card"><textarea rows="3" onchange="S.intent=this.value;save()">${esc(S.intent)}</textarea></div><p class="sub">Each account keeps its own currency, so nothing is converted or estimated. Data stays private in this browser.</p>`}
function addAcc(){const n=$('#an').value.trim();if(!n)return;S.accts.push({id:'a'+Date.now(),name:n,cur:$('#ac').value,open:0});save();render()}
function render(keep){$('#app').innerHTML=V=='home'?home():V=='bud'?bud():V=='sav'?sav():setv();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==V));if(keep){const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{V=b.dataset.v;render()});
let T='expense';
function openAdd(p,gid){T=p||'expense';$('#shc').innerHTML=`<h2 style="margin-top:0">New transaction</h2><div class="seg"><button data-t="expense">Expense</button><button data-t="income">Income</button><button data-t="transfer">Transfer</button><button data-t="saving">Saving</button></div><label>Amount</label><input id="am" type="number" inputmode="decimal" step="any" placeholder="0.00"><label>Account</label><select id="ac1" onchange="fillTo()">${S.accts.map(a=>`<option value="${a.id}">${esc(a.name)} (${a.cur})</option>`).join('')}</select><div id="toR"><label>To account</label><select id="to"></select></div><div id="gR"><label>For which dream?</label><select id="gl"></select></div><div id="catR"><label>Category</label><select id="cat"></select></div><label>Description</label><input id="ds" placeholder="Optional"><label>Date</label><input id="dt" type="date" value="${today()}"><button class="save" onclick="addTx()">Save</button>`;
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{T=b.dataset.t;sync()});sync();if(gid){const g=S.goals.find(x=>x.id==gid),a=g&&S.accts.find(x=>x.cur==g.cur);if(a){$('#ac1').value=a.id;fillTo();$('#gl').value=gid}}$('#sh').classList.add('show');setTimeout(()=>$('#am').focus(),50)}
function sync(){document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.t==T));$('#toR').style.display=T=='transfer'?'block':'none';$('#gR').style.display=T=='saving'?'block':'none';$('#catR').style.display=T=='income'||T=='expense'?'block':'none';$('#cat').innerHTML=(T=='income'?INC:EXP).map(c=>`<option>${c}</option>`).join('');fillTo()}
function fillTo(){const f=acc($('#ac1').value);$('#to').innerHTML=S.accts.filter(a=>a.id!=f.id&&a.cur==f.cur).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')||'<option value="">No other account in this currency</option>';$('#gl').innerHTML=S.goals.filter(g=>g.cur==f.cur).map(g=>`<option value="${g.id}">${g.emoji} ${esc(g.name)}</option>`).join('')||'<option value="">Plant a dream in Savings first</option>'}
function addTx(){const amt=+$('#am').value;if(!(amt>0))return $('#am').focus();const t={id:String(Date.now()),type:T,amt,acct:$('#ac1').value,date:$('#dt').value||today(),desc:$('#ds').value.trim(),cat:T=='transfer'?'Transfer':T=='saving'?'Savings':$('#cat').value};if(T=='transfer'){t.to=$('#to').value;if(!t.to)return}if(T=='saving'){t.goal=$('#gl').value;if(!t.goal)return}S.tx.push(t);save();M=t.date.slice(0,7);$('#sh').classList.remove('show');render();toast('Saved ✿')}
$('#sh').onclick=e=>{if(e.target.id=='sh')$('#sh').classList.remove('show')};
let tt;function toast(m,undo){const e=$('#toast');e.innerHTML=esc(m)+(undo?'<button id="un">Undo</button>':'');e.style.display='block';if(undo)$('#un').onclick=()=>{undo();e.style.display='none'};clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',4000)}
function del(id){const i=S.tx.findIndex(t=>t.id==id),t=S.tx[i];S.tx.splice(i,1);save();render();toast('Deleted',()=>{S.tx.splice(i,0,t);save();render()})}
render();
</script></body></html>
